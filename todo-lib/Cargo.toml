[package]
name = "justorgyou-todo"
version = "0.1.0"
edition = "2021"
authors = ["JustOrgYou Team"]
description = "Core todo library for JustOrgYou task management system"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1.0"
orgize = "0.9"
regex = "1.10"
uuid = { version = "1.6", features = ["v4", "serde"] }

[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "task_operations"
harness = false
